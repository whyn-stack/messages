<style>
:root{color-scheme:light;--blue:#007AFF;--gray:#8E8E93;--recv:#E9E9EB;--kb:#CFD2D9;--dk:#ABB0BC;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#f9f9f9;overflow:hidden;font-family:var(--font)}

.f{position:absolute}

.sb{background:linear-gradient(90deg,#9d9da1,#f0f0f2,#a5a5a9);border-radius:3px}
.slot{left:890px;top:147px;width:130px;height:12px;border-radius:6px;background:#34343a}
.box{left:591px;top:173px;width:390px;height:844px;transform:scale(1.8667);transform-origin:0 0}
.scr{position:absolute;inset:0;border-radius:47px;overflow:hidden;background:#fff}
body.bare #world{left:0;top:0}

body.bare .box{left:0;top:0;transform:none}

.a{position:absolute}
.hd{left:0;top:0;width:390px;height:126px;background:#F6F6F6;border-bottom:.5px solid rgba(0,0,0,.2);z-index:4}

.notch::before,.notch::after{content:"";position:absolute;top:0;width:11px;height:11px}
.notch::before{left:-11px;background:radial-gradient(circle at 0 100%,transparent 10.2px,#000 10.8px)}

.b{position:relative;max-width:277px;padding:7px 12px;font-size:17px;line-height:20px;letter-spacing:-.4px;border-radius:18px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere;flex:none}
.b.g{margin-top:10px}.msgs>:first-child{margin-top:auto!important}
.me{align-self:flex-end;color:#fff;background:#1a7cff}
.you{align-self:flex-start;background:var(--recv);color:#000}
.tail::before,.tail::after{content:"";position:absolute;bottom:0;height:18px}
.me.tail::before{right:-7px;width:20px;background:inherit;border-bottom-left-radius:16px 14px}
.me.tail::after{right:-26px;width:26px;background:#fff;border-bottom-left-radius:10px}
.you.tail::before{left:-7px;width:20px;background:var(--recv);border-bottom-right-radius:16px 14px}
.you.tail::after{left:-26px;width:26px;background:#fff;border-bottom-right-radius:10px}
.dl{align-self:flex-end;font-size:12.5px;line-height:15px;font-weight:600;color:#8E8E93;margin-top:3.7px;letter-spacing:-.1px;flex:none}
.row{flex:none;display:flex;align-items:flex-end;padding:8px 17px 5px 18px}
.field{position:relative;flex:1;margin-left:17px;min-height:34px;border:1px solid #c8c8cc;border-radius:17px;background:#fff}
.fx{padding:6px 34px 6px 12px;font-size:17px;line-height:20px;letter-spacing:-.4px;white-space:pre-wrap;overflow-wrap:anywhere;color:#000;max-height:112px;overflow:hidden;min-height:32px;display:flex;flex-wrap:wrap;align-items:flex-start}
.ph{color:#c3c3c7;position:absolute;left:12px;top:6px;line-height:20px;font-size:17px;letter-spacing:-.4px}
.cur{display:inline-block;width:2px;height:21px;background:var(--blue);margin:-1px 0 0 0;vertical-align:top;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.mic{position:absolute;right:11px;bottom:5px;transition:opacity .15s}
.snd{position:absolute;right:3px;bottom:3px;width:26px;height:26px;border-radius:50%;background:var(--blue);border:0;padding:0;opacity:0;transform:scale(.4);transition:.18s;cursor:pointer}
.has .mic{opacity:0}.has .snd{opacity:1;transform:none}
.kb{left:0;top:552px;width:390px;height:292px;background:var(--kb);z-index:5}
.k{position:absolute;height:42px;border-radius:5px;background:#fff;box-shadow:0 1px 0 #898b8d;display:flex;align-items:center;justify-content:center;font-size:23px;color:#000;cursor:pointer}
.k.d{background:var(--dk);font-size:16px}
.k:active{background:var(--dk)}.k.d:active{background:#fff}
.kb:not(.caps) .l{text-transform:none}.kb.caps .l{text-transform:uppercase}
.ap{position:absolute;top:10.5px;width:40px;height:29.6px;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:13px;color:#fff}
.home{left:125.5px;top:830.5px;width:139px;height:5px;border-radius:3px;background:#000;z-index:8}
svg{display:block}.has .snd.press{transform:scale(.86);background:#0a5fd0}#em.press{opacity:.35}.k.press{background:var(--dk)}.k.d.press{background:#fff}.shk path{fill:none}.kb.shift .shk{background:#fff}.kb.shift .shk path{fill:#000}
</style>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){
    var bare=innerWidth<=500;document.body.classList.toggle('bare',bare);
    var W=bare?390:874,H=bare?844:1722,s=Math.min(innerWidth/W,innerHeight/H);
    stage.style.width=W+'px';stage.style.height=H+'px';stage.style.transform='scale('+s+')';
    stage.style.left=(innerWidth-W*s)/2+'px';stage.style.top=(innerHeight-H*s)/2+'px';
  }
  addEventListener('resize',fit);fit();
  var msgs=document.getElementById('msgs'),kb=document.getElementById('kb'),fx=document.getElementById('fx'),
      ph=document.getElementById('ph'),field=document.getElementById('field'),snd=document.getElementById('snd');
  var last=null,dl=null;
  function lerp(a,b,t){return Math.round(a+(b-a)*t)}
  function blue(y){var t=Math.max(0,Math.min(1,(y-141)/292));return 'rgb('+lerp(30,10,t)+','+lerp(137,110,t)+',255)'}
  function add(type,t,w){
    if(dl){dl.remove();dl=null}
    var e=document.createElement('div');e.className='b '+type+' tail';e.textContent=t;
    if(w)e.style.width=w+'px';
    if(last&&last.type===type){last.el.classList.remove('tail')}else if(last){e.classList.add('g')}
    msgs.appendChild(e);last={type:type,el:e};
    if(type==='me')e.style.background=blue(126+e.offsetTop-msgs.scrollTop);
  }
  function delivered(){if(dl)dl.remove();dl=document.createElement('div');dl.className='dl';dl.textContent='Delivered';msgs.appendChild(dl)}
  add('me','주지 말라며 주지 말라며 주지 말라며 주지 말라며 주지 말라며 주지 말라며');
  add('you','받지 말라는 말은 안 했다');
  msgs.scrollTop=msgs.scrollHeight;

  /* 한글 조합 (두벌식) */
  var CH=[].slice.call('ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'),JU=[].slice.call('ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'),
      JO=[''].concat([].slice.call('ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'));
  var VC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'},
      TC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
  function split(m,c){for(var k in m)if(m[k]===c)return k;return null}
  var base='',s=null,busy=true,kmap={};
  function disp(s){if(s.l>=0&&s.v>=0)return String.fromCharCode(0xAC00+(s.l*21+s.v)*28+s.t);return s.l>=0?CH[s.l]:JU[s.v]}
  function val(){return base+(s?disp(s):'')}
  function commit(){if(s){base+=disp(s);s=null}}
  function jamo(j){
    var vi=JU.indexOf(j),li=CH.indexOf(j),ti=JO.indexOf(j);
    if(vi>=0){
      if(!s){s={l:-1,v:vi,t:0};return}
      if(s.v<0){s.v=vi;return}
      if(s.l<0){commit();s={l:-1,v:vi,t:0};return}
      if(s.t===0){var c=VC[JU[s.v]+j];if(c){s.v=JU.indexOf(c);return}commit();s={l:-1,v:vi,t:0};return}
      var f=JO[s.t],sp=split(TC,f),mv;
      if(sp){s.t=JO.indexOf(sp[0]);mv=sp[1]}else{mv=f;s.t=0}
      commit();s={l:CH.indexOf(mv),v:vi,t:0};return;
    }
    if(!s){s={l:li,v:-1,t:0};return}
    if(s.v<0||s.l<0){commit();s={l:li,v:-1,t:0};return}
    if(s.t===0){if(ti>0){s.t=ti;return}commit();s={l:li,v:-1,t:0};return}
    var c2=TC[JO[s.t]+j];if(c2){s.t=JO.indexOf(c2);return}
    commit();s={l:li,v:-1,t:0};
  }
  function bk(){
    if(s){
      if(s.t>0){var sp=split(TC,JO[s.t]);s.t=sp?JO.indexOf(sp[0]):0}
      else if(s.v>=0){var sv=split(VC,JU[s.v]);if(sv)s.v=JU.indexOf(sv[0]);else{s.v=-1;if(s.l<0)s=null}}
      else s=null;
    }else base=base.slice(0,-1);
  }
  function raw(c){commit();base+=c}
  function render(){
    var v=val();fx.textContent=v;
    var c=document.createElement('span');c.className='cur';fx.appendChild(c);
    ph.style.display=v?'none':'block';
    field.parentNode.classList.toggle('has',!!v.trim());
    msgs.scrollTop=msgs.scrollHeight;
  }
  function send(){
    if(busy)return;var t=val().replace(/\s+$/,'');if(!t.trim())return;
    add('me',t);delivered();base='';s=null;setShift(false);render();
    setTimeout(function(){msgs.scrollTop=msgs.scrollHeight},0);
  }
  snd.addEventListener('click',send);

  /* 키보드 */
  var P=39.05,sh=false,lk=[],shk=null,ksw=null,mode='ko',prev='ko';
  var R1='ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ',R1S='ㅃㅉㄸㄲㅆㅛㅕㅑㅒㅖ';
  var LY={ko:[R1,R1S,'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ','ㅁㄴㅇㄹㅎㅗㅓㅏㅣ','ㅋㅌㅊㅍㅠㅜㅡ','ㅋㅌㅊㅍㅠㅜㅡ'],en:['qwertyuiop','QWERTYUIOP','asdfghjkl','ASDFGHJKL','zxcvbnm','ZXCVBNM']};
  var SHF='<svg width="22" height="21" viewBox="0 0 22 21"><path d="M11 1.5 1.5 11H6.5v7.5h9V11h5z" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  var DEL='<svg width="28" height="20" viewBox="0 0 28 20" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M9.5 1.5H24a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H9.5L1.5 10z"/><path d="m13.5 6.5 7 7m0-7-7 7"/></svg>';
  var RET='<svg width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 2v7.5a3.5 3.5 0 0 1-3.5 3.5H3"/><path d="M7.5 8.5 2.5 13l5 4.5"/></svg>';
  function key(label,x,y,w,cls,fn){
    var d=document.createElement('div');d.className='k '+(cls||'');d.textContent=label;
    d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';
    d.addEventListener('mousedown',function(e){e.preventDefault()});
    d.addEventListener('click',function(){if(!busy)fn()});kb.appendChild(d);return d;
  }
  function setShift(b){sh=b;kb.classList.toggle('shift',b);lk.forEach(function(k){k.el.textContent=b?k.up:k.lo})}
  function build(m){
    [].slice.call(kb.querySelectorAll('.k')).forEach(function(k){k.remove()});
    lk=[];kmap={};sh=false;kb.classList.remove('shift');mode=m;
    if(m==='num'){
      var N=['1234567890','-/:;()$&@"'];
      N.forEach(function(str,r){for(var i=0;i<10;i++)(function(ch,x){kmap[ch]=key(ch,x,8.8+r*54,33,'',function(){raw(ch);render()})})(str[i],3.2+i*P)});
      shk=key('#+=',3.2,116.6,43.4,'d',function(){});
      var n3=".,?!'";
      for(var q=0;q<5;q++)(function(ch,x){kmap[ch]=key(ch,x,116.6,49,'',function(){raw(ch);render()})})(n3[q],63+q*55.5);
      ksw=key('ABC',3.2,170.7,91,'d',function(){build(prev)});
    }else{
      var L=LY[m];
      [[0,3.2,8.8],[2,22.5,62.8],[4,61.6,116.6]].forEach(function(r){
        var lo=L[r[0]],up=L[r[0]+1];
        for(var i=0;i<lo.length;i++)(function(a,b,x){
          var el=key(a,x,r[2],33,'',function(){var c=sh?b:a;if(mode==='ko')jamo(c);else raw(c);if(sh)setShift(false);render()});
          lk.push({el:el,lo:a,up:b});kmap[a]=el;kmap[b]=el;
        })(lo[i],up[i],r[1]+i*P);
      });
      shk=key('',3.2,116.6,43.4,'d shk',function(){setShift(!sh)});shk.innerHTML=SHF;
      ksw=key('123',3.2,170.7,91,'d',function(){prev=mode;build('num')});
    }
    key('',343.3,116.6,42.7,'d',function(){bk();render()}).innerHTML=DEL;
    key('',100.7,170.7,188.6,'',function(){raw(' ');render()});
    key('',295.7,170.7,90.5,'d',function(){raw('\n');render()}).innerHTML=RET;
  }
  var em=document.getElementById('em');
  em.addEventListener('click',function(){if(busy)return;var c=mode==='num'?prev:mode;prev=c==='ko'?'en':'ko';build(prev)});

  /* PC 키보드 (영문 자판 위치 -> 두벌식) */
  var M={KeyQ:'ㅂ',KeyW:'ㅈ',KeyE:'ㄷ',KeyR:'ㄱ',KeyT:'ㅅ',KeyY:'ㅛ',KeyU:'ㅕ',KeyI:'ㅑ',KeyO:'ㅐ',KeyP:'ㅔ',KeyA:'ㅁ',KeyS:'ㄴ',KeyD:'ㅇ',KeyF:'ㄹ',KeyG:'ㅎ',KeyH:'ㅗ',KeyJ:'ㅓ',KeyK:'ㅏ',KeyL:'ㅣ',KeyZ:'ㅋ',KeyX:'ㅌ',KeyC:'ㅊ',KeyV:'ㅍ',KeyB:'ㅠ',KeyN:'ㅜ',KeyM:'ㅡ'},
      MS={KeyQ:'ㅃ',KeyW:'ㅉ',KeyE:'ㄸ',KeyR:'ㄲ',KeyT:'ㅆ',KeyO:'ㅒ',KeyP:'ㅖ'};
  addEventListener('keydown',function(e){
    if(busy||e.metaKey||e.ctrlKey||e.altKey)return;
    if(mode==='ko'&&M[e.code]){e.preventDefault();jamo(e.shiftKey&&MS[e.code]?MS[e.code]:M[e.code]);render()}
    else if(e.key==='Enter'){e.preventDefault();if(e.shiftKey){raw('\n');render()}else send()}
    else if(e.key==='Backspace'){e.preventDefault();bk();render()}
    else if(e.code==='Space'){e.preventDefault();raw(' ');render()}
    else if(e.key.length===1){e.preventDefault();raw(e.key);render()}
  });
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  function flash(el){if(!el)return;el.classList.add('press');setTimeout(function(){el.classList.remove('press')},120)}
  function parts(j){var a=split(VC,j)||split(TC,j);return a?[].slice.call(a):[j]}
  async function ensure(m){
    if(m==='num'){if(mode!=='num'){prev=mode;flash(ksw);await sleep(130);build('num');await sleep(260)}return}
    if(mode==='num'){flash(ksw);await sleep(130);build(prev);await sleep(260)}
    if(mode!==m){flash(em);await sleep(150);prev=m;build(m);await sleep(380)}
  }
  async function autoType(txt){
    await sleep(900);
    for(var ch of txt){
      var n=ch.charCodeAt(0)-0xAC00;
      if(n>=0&&n<11172){
        await ensure('ko');
        var seq=[CH[Math.floor(n/588)]].concat(parts(JU[Math.floor(n%588/28)]),n%28?parts(JO[n%28]):[]);
        for(var j of seq){
          var sf=R1S.indexOf(j)>=0&&R1.indexOf(j)<0;
          if(sf){setShift(true);flash(shk);await sleep(110)}
          flash(kmap[j]);jamo(j);if(sf)setShift(false);render();await sleep(150);
        }
      }else{
        await ensure(/[a-z]/i.test(ch)?'en':'num');
        flash(kmap[ch]);raw(ch);render();await sleep(150);
      }
    }
    await sleep(700);
    snd.classList.add('press');await sleep(160);snd.classList.remove('press');
    busy=false;send();
  }
  build('ko');
  autoType('bit.ly/빼빼로라고안했다');
  render();
})();
</script>
